services:
  - type: web
    name: lotto-probability
    runtime: static
    buildCommand: corepack enable && pnpm install && pnpm build
    staticPublishPath: apps/lotto/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html