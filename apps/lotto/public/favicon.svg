<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#b45309"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="url(#goldGrad)"/>

  <!-- Double L monogram with lens-like styling -->
  <g fill="#fffbeb">
    <!-- First L -->
    <path d="M120 100 h70 v260 h130 v60 h-200 z"/>

    <!-- Second L (offset, creating depth) -->
    <path d="M200 100 h70 v260 h130 v60 h-200 z" opacity="0.6"/>
  </g>

  <!-- Small lens accent (circle) in corner -->
  <circle cx="400" cy="400" r="50" fill="none" stroke="#fffbeb" stroke-width="16"/>
  <circle cx="400" cy="400" r="25" fill="#fffbeb" opacity="0.4"/>
</svg>
